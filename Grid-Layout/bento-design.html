<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5-Box Bento Grid Layout</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: system-ui, sans-serif;
        background-color: #f7f9fa;
        padding: 40px 20px;
    }

    .bento-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: 150px;
        gap: 16px;
        max-width: 900px;
        margin: 0 auto;
    }

    /* Base Item Styling */
    .bento-item {
        border-radius: 16px;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    /* 5 Grid Placements and Colors */
    .item-1 {
        grid-column: span 2;
        grid-row: span 2;
        background-color: #ffd166;
        color: #333;
    }

    .item-2 {
        grid-column: span 1;
        grid-row: span 1;
        background-color: #ef476f;
        color: white;
    }

    .item-3 {
        grid-column: span 1;
        grid-row: span 1;
        background-color: #06d6a0;
        color: #333;
    }

    .item-4 {
        grid-column: span 1;
        grid-row: span 2;
        background-color: #118ab2;
        color: white;
    }

    .item-5 {
        grid-column: span 2;
        grid-row: span 1;
        background-color: #073b4c;
        color: white;
    }
</style>
</head>
<body>
    
<div class="bento-grid">
    <div class="bento-item item-1">1</div>
    <div class="bento-item item-2">2</div>
    <div class="bento-item item-3">3</div>
    <div class="bento-item item-4">4</div>
    <div class="bento-item item-5">5</div>
</div>

</body>
</html>
