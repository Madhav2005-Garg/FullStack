<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    }
    .con {
    display: grid;
    grid-template-columns: 1fr 1.5fr 1.5fr;
    grid-template-rows: auto auto auto auto;
    gap: 10px;
    width: 100%;
    max-width: 400px;
    }
    body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 97vh;
    }
    .con {
    display: grid;
    grid-template-columns: 1fr 1.5fr 1.5fr;
    grid-template-rows: auto auto auto auto;
    gap: 10px;
    width: 100%;
    max-width: 400px;
    }
    .h {
    grid-column: 1 / -1;
    background-color: lightcoral;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 5/1;
    font-size: 14px;
    }
    .s {
    grid-column: 1;
    grid-row: 2 / span 3;
    background-color: lightgreen;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    }
    .m {
    grid-column: 2 / -1;
    grid-row: 2;
    background-color: lightblue;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 4/1;
    font-size: 14px;
    }
    .c1 {
    grid-column: 2;
    grid-row: 3;
    background-color: lightyellow;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1/1;
    font-size: 14px;
    }
    .c2 {
    grid-column: 3;
    grid-row: 3;
    background-color: lightpink;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1/1;
    font-size: 14px;
    }
    .f {
    grid-column: 1 / -1;
    grid-row: 4;
    background-color: lightgray;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 5/1;
    font-size: 14px;
    }
</style>
</head>
<body>
    <div class="con">
    <div class="h">Header</div>
    <div class="s">Sidebar</div>
    <div class="m">Main Content</div>
    <div class="c1">Card 1</div>
    <div class="c2">Card 2</div>
    <div class="f">Footer</div>
    </div>
</body>
</html>
