<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            display: grid;
            outline:1px solid black;
            height:500px;
            width:500px;
            grid-template-columns: 1fr 1fr 1fr;
        }
        .con>div{
            outline: 1px dashed grey;
            font-size: 30px;
        }
        #box1{
            grid-column: 1/4;
            grid-row:1/4;
            background-color: yellow; 
        }
        #box2{
            grid-column:2/4;
            grid-row:1/3;
            background-color: orange;
        }
        #box3{
            grid-column:3/4;
            grid-row:1/1;
            background-color: red;
        }
        #box4{
            grid-column:4/5;
            grid-row:1/2;
            background-color: red;
        }
        #box5{
            grid-column:4/6;
            grid-row:1/3;
        }
        #box6{
            grid-column:4/7;
            grid-row:1/3;
        }
    </style>
</head>
<body>
    <div class="con">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
    </div>
</body>
</html>
