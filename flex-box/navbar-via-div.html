<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
        }
        .container{
            display:flex;
            flex-direction:row;
            background-color: black;  
            height:97 vh;
            width:97 vw;
        }
        .home , .about , .service , .contact , .login ,.main{
            padding: 10px;
            margin: 5px;
            color: white;
        }
        .login{
            background-color:blue;
            color:white;
            border-radius:5px;
            margin-left: auto;
        }
        .main{
            font-size: 22px;
            font-weight: bold;
            width : 150px;
        }
        .logo{
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><img src="Tech.png" width="30px" height="30px"></div>
        <div class="main">TechNova</div>
        <div class="home">Home</div>
        <div class="about">About</div>
        <div class="service">Services</div>
        <div class="contact">Contact</div>
        <div class="login">Login</div>
    </div>
</body>
</html>
