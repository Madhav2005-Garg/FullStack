<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2+p{
            color:blue;
        }
        h2~p{
            text-transform: uppercase;
        }
        section h2{
            color:yellow;
            text-shadow: 1px 1px 0px black;
        }
        section>h2{
            text-transform: lowercase;
        }
    </style>
</head>
<body>
    <section>
        <h2>Heading</h2>
        <p>Para 1</p>
        <p>Para 2</p>
        <diV>
            <h2>Heading 2</h2>
        </diV>
    </section>
</body>
</html>
